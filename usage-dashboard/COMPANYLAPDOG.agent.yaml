instructions:
  response: "Be professional and concise. Lead with the answer, then support it with data.\n\nFormatting rules:\n- Use markdown tables for tabular results (top-N lists, comparisons, breakdowns).\n- Use bullet points for summaries and key findings.\n- Bold important numbers, thresholds, and anomalies.\n- When reporting budget data, always show both the allocated amount and actual spend with the variance (over/under).\n- Flag usage spikes and unresolved alerts prominently.\n- Keep responses under 300 words unless the user asks for detail.\n- Do not repeat the question back or add unnecessary preamble.\n- Use USD formatting with commas for dollar amounts (e.g. $1,234.56)."
  orchestration: "Use the Company_LapDog analyst tool for ALL data questions — costs, usage, budgets, employees, teams, services, alerts, and spikes. This is the primary tool and should be your first choice for any question involving cloud service data.\n\nUse code_execution only when the user explicitly requests a chart, visualization, statistical calculation, or data transformation that cannot be expressed in a single SQL query. Do not use code_execution for simple lookups or aggregations.\n\nWhen a question spans multiple dimensions (e.g. \"top spenders by team with budget status\"), prefer a single Analyst query over multiple calls. If one query cannot capture everything, make sequential Analyst calls and synthesize the results."
  sample_questions: []
tools:
  - tool_spec:
      type: "cortex_analyst_text_to_sql"
      name: "Company_LapDog"
      description: "DAILY_USAGE:\n- Database: ECON_AGENT_DB, Schema: ANALYTICS\n- Records daily cloud service consumption per employee per service, capturing cost, query activity, and session counts.\n- Serves as the central fact table linking employees and services, and flags abnormal usage spikes via IS_SPIKE.\n- LIST OF COLUMNS: USAGE_ID (unique daily usage record id), EMPLOYEE_ID (employee identifier - links to EMPLOYEE_ID in EMPLOYEES), SERVICE_ID (service identifier - links to SERVICE_ID in SERVICES), USAGE_DATE (date of usage), COST_USD (cost in US dollars), UNITS_CONSUMED (units of service consumed), QUERY_COUNT (number of queries run), SESSION_COUNT (number of sessions), IS_SPIKE (boolean flag for abnormal usage spike)\n\nEMPLOYEES:\n- Database: ECON_AGENT_DB, Schema: ANALYTICS\n- Contains profile information for each of the 100 employees, including role, seniority, and team assignment.\n- Links to TEAMS via TEAM_ID, enabling team-level aggregations of individual usage.\n- LIST OF COLUMNS: EMPLOYEE_ID (unique employee identifier), FULL_NAME (employee full name), EMAIL (employee email address), ROLE_TITLE (job title), SENIORITY (seniority level e.g. junior/senior), IS_ACTIVE (boolean active status), TEAM_ID (team identifier - links to TEAM_ID in TEAMS), HIRE_DATE (date employee was hired)\n\nMONTHLY_BUDGET:\n- Database: ECON_AGENT_DB, Schema: ANALYTICS\n- Tracks monthly budget allocations and actual spending per team, enabling budget variance analysis.\n- Connects to TEAMS via TEAM_ID to associate financial targets with organizational units.\n- LIST OF COLUMNS: BUDGET_ID (unique budget record id), TEAM_ID (team identifier - links to TEAM_ID in TEAMS), BUDGET_MONTH (month of the budget period), BUDGET_AMOUNT (allocated budget in USD), ACTUAL_SPEND (actual amount spent in USD)\n\nSERVICES:\n- Database: ECON_AGENT_DB, Schema: ANALYTICS\n- Defines each Snowflake cloud service available, including category, unit of measurement, and per-unit cost.\n- Acts as a reference/lookup table joined to DAILY_USAGE for cost and service-level breakdowns.\n- LIST OF COLUMNS: SERVICE_ID (unique service identifier), SERVICE_NAME (name of the cloud service), DESCRIPTION (description of the service), SERVICE_CATEGORY (category grouping of the service), UNIT (unit of consumption measurement), COST_PER_UNIT (price per unit consumed in USD)\n\nTEAMS:\n- Database: ECON_AGENT_DB, Schema: ANALYTICS\n- Represents the 5 organizational teams, each with a department, manager, and cost center designation.\n- Referenced by both EMPLOYEES and MONTHLY_BUDGET to provide team-level context for usage and budget analysis.\n- LIST OF COLUMNS: TEAM_ID (unique team identifier), TEAM_NAME (name of the team), DEPARTMENT (department the team belongs to), MANAGER_NAME (name of the team manager), COST_CENTER (cost center code for financial tracking)\n\nUSAGE_ALERTS:\n- Database: ECON_AGENT_DB, Schema: ANALYTICS\n- Logs usage spike alerts triggered when an employee's cost on a service significantly exceeds the normal average.\n- Captures alert severity, resolution status, and cost multiplier to support anomaly investigation and remediation.\n- LIST OF COLUMNS: ALERT_ID (unique alert identifier), EMPLOYEE_ID (employee who triggered the alert - links to EMPLOYEE_ID in EMPLOYEES), SERVICE_ID (service involved in the alert - links to SERVICE_ID in SERVICES), ALERT_DATE (date the alert was triggered), ALERT_TYPE (type/category of the alert), SEVERITY (severity level e.g. low/medium/high), RESOLVED (boolean resolution status), RESOLUTION_NOTES (notes on how the alert was resolved), SPIKE_COST (cost recorded during the spike), NORMAL_AVG_COST (baseline average cost for comparison), MULTIPLIER (ratio of spike cost to normal average cost)\n\nREASONING:\nThis semantic view covers the full lifecycle of cloud service usage analytics across 100 employees and 5 teams. DAILY_USAGE is the core fact table connecting EMPLOYEES and SERVICES, while MONTHLY_BUDGET tracks team-level financial performance against targets. USAGE_ALERTS captures anomalies tied to employees and services. TEAMS acts as the top-level organizational anchor referenced by both EMPLOYEES and MONTHLY_BUDGET.\n\nDESCRIPTION:\nThe USAGE_ANALYTICS_SV semantic view (database: ECON_AGENT_DB, schema: ANALYTICS) provides end-to-end visibility into company cloud service usage, costs, and budgets across 100 employees organized into 5 teams. The DAILY_USAGE table is the central fact table that joins to EMPLOYEES (via EMPLOYEE_ID) and SERVICES (via SERVICE_ID) to record per-day costs, query counts, session counts, and spike flags. EMPLOYEES links to TEAMS (via TEAM_ID), and MONTHLY_BUDGET also links to TEAMS (via TEAM_ID), enabling cross-table analysis of actual spend versus allocated budgets at the team level. USAGE_ALERTS captures cost anomalies per employee and service, storing severity, resolution status, spike costs, and normal baselines for anomaly management. Together, these tables support queries on top spenders, service cost rankings, team budget variances, seniority-based usage patterns, and alert severity distributions."
  - tool_spec:
      type: "code_execution"
      name: "code_execution"
