verified_queries:
  - name: '"0;1"'
    sql: "SELECT t.TEAM_NAME, SUM(u.COST_USD) AS total_cost FROM daily_usage AS u JOIN employees AS e ON u.EMPLOYEE_ID = e.EMPLOYEE_ID JOIN teams AS t ON e.TEAM_ID = t.TEAM_ID WHERE u.USAGE_DATE BETWEEN '2025-01-01' AND '2025-08-31' GROUP BY t.TEAM_NAME ORDER BY total_cost DESC"
    question: Which team had the highest cloud service costs from January through August 2025?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"1;1"'
    sql: "SELECT e.FULL_NAME, t.TEAM_NAME, SUM(u.COST_USD) AS total_cost FROM daily_usage AS u JOIN employees AS e ON u.EMPLOYEE_ID = e.EMPLOYEE_ID JOIN teams AS t ON e.TEAM_ID = t.TEAM_ID GROUP BY e.FULL_NAME, t.TEAM_NAME ORDER BY total_cost DESC LIMIT 10"
    question: Who are the top 10 employees with the highest cloud service usage costs?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"2;1"'
    sql: "SELECT s.SERVICE_NAME, SUM(u.COST_USD) AS total_cost, SUM(u.QUERY_COUNT) AS total_queries FROM daily_usage AS u JOIN services AS s ON u.SERVICE_ID = s.SERVICE_ID GROUP BY s.SERVICE_NAME ORDER BY total_cost DESC"
    question: What are the most expensive services?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"3;1"'
    sql: "SELECT DATE_TRUNC('MONTH', u.USAGE_DATE) AS month, SUM(u.COST_USD) AS monthly_cost FROM daily_usage AS u GROUP BY month ORDER BY month"
    question: What is the monthly cost trend for our cloud service usage?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"4;1"'
    sql: "SELECT a.SEVERITY, COUNT(*) AS alert_count FROM usage_alerts AS a GROUP BY a.SEVERITY ORDER BY alert_count DESC"
    question: How many alerts are there by severity level?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"5;1"'
    sql: "SELECT t.TEAM_NAME, SUM(b.BUDGET_AMOUNT) AS budget, SUM(b.ACTUAL_SPEND) AS actual, SUM(b.BUDGET_AMOUNT) - SUM(b.ACTUAL_SPEND) AS variance FROM monthly_budget AS b JOIN teams AS t ON b.TEAM_ID = t.TEAM_ID GROUP BY t.TEAM_NAME ORDER BY variance"
    question: Which teams are over or under budget?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"6;1"'
    sql: "SELECT e.FULL_NAME, s.SERVICE_NAME, SUM(u.COST_USD) AS total_cost FROM daily_usage AS u JOIN employees AS e ON u.EMPLOYEE_ID = e.EMPLOYEE_ID JOIN services AS s ON u.SERVICE_ID = s.SERVICE_ID GROUP BY e.FULL_NAME, s.SERVICE_NAME ORDER BY total_cost DESC LIMIT 20"
    question: Which employees spend the most on which services?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
  - name: '"7;1"'
    sql: "SELECT e.SENIORITY, AVG(u.COST_USD) AS avg_daily_cost, SUM(u.COST_USD) AS total_cost FROM daily_usage AS u JOIN employees AS e ON u.EMPLOYEE_ID = e.EMPLOYEE_ID GROUP BY e.SENIORITY ORDER BY total_cost DESC"
    question: How does spending vary by seniority level?
    verified_at: 1790309597
    verified_by: Semantic Model Generator
    use_as_onboarding_question: false
